/* ===== HSK 1 - GIAO DIỆN RIÊNG ===== */
:root{
  --hsk-bg:#f4f1fb;
  --hsk-surface:#ffffff;
  --hsk-primary:#6b4bb6;
  --hsk-primary-dark:#4f338d;
  --hsk-accent:#e46a9f;
  --hsk-soft:#eee8fa;
  --hsk-border:#d9cdef;
  --hsk-text:#29233b;
  --hsk-muted:#746d84;
}
html,body{background:var(--hsk-bg)!important;color:var(--hsk-text)!important}
body{
  background:linear-gradient(180deg,#f8f5fd 0%,#f0edf9 100%)!important;
}
.top,.header,.hero{
  background:linear-gradient(135deg,#6b4bb6,#8b6bc9)!important;
  color:#fff!important;
}
.top h1,.header h1,.hero h1,
.top h2,.header h2,.hero h2{color:#fff!important}
.card,.gcard,.lesson,.panel,.wordCard,.vocabCard,.grammarCard{
  background:var(--hsk-surface)!important;
  border-color:var(--hsk-border)!important;
}
h1,h2,h3,h4,
.lessonTitle,.sectionTitle,.bookTitle{
  color:var(--hsk-primary)!important;
}
button,.btn,.tab,.bookTab{
  background:var(--hsk-primary)!important;
  border-color:var(--hsk-primary)!important;
  color:#fff!important;
}
button:hover,.btn:hover,.tab:hover,.bookTab:hover{
  background:var(--hsk-primary-dark)!important;
}
input,select,textarea{
  background:#fff!important;
  border-color:var(--hsk-border)!important;
  color:var(--hsk-text)!important;
}
.formula,.grammarTopic,.grammarFormula{
  background:#f1ecfb!important;
  border-color:#ddd2f1!important;
  color:#40345b!important;
}
.grammarTopicTitle{color:var(--hsk-primary-dark)!important}
.grammarExample{border-left-color:var(--hsk-accent)!important}
.mnemonicInfo{
  background:#fff0f6!important;
  border-color:#f0c8dc!important;
  border-left-color:var(--hsk-accent)!important;
  color:#553348!important;
}
.mnemonicInfo .mnemonicTitle{color:#b33d72!important}
.strokeBox{
  background:#fbfaff!important;
  border-color:#d9cdef!important;
}
.writeTools button{background:#7a5bc1!important}
.writeTools .clear{background:#d65f91!important}
.writeStatus.done{color:#4f338d!important}
.searchBox,.search-bar{
  background:#fff!important;
  border-color:#d9cdef!important;
}
.highlight,.active,.selected{

}
footer{color:var(--hsk-muted)!important}

/* ===== HSK 1 — GAM LẠNH NHẸ, DỊU MẮT ===== */
:root{
  --hsk-bg:#f4f8fa;
  --hsk-surface:#ffffff;
  --hsk-primary:#52758a;
  --hsk-primary-dark:#3f6074;
  --hsk-accent:#7d9eae;
  --hsk-soft:#edf4f7;
  --hsk-border:#d7e3e8;
  --hsk-text:#34434b;
  --hsk-muted:#71818a;
  --hsk-vocab:#edf6f8;
  --hsk-vocab-border:#cfe1e7;
}
html,body{background:var(--hsk-bg)!important;color:var(--hsk-text)!important}
body{background:linear-gradient(180deg,#f7fafb 0%,#f0f5f7 100%)!important}

/* Header */
.top,.header,.hero{
  background:linear-gradient(135deg,#607f91,#7896a5)!important;
  color:#fff!important;
}
.top h1,.header h1,.hero h1,.top h2,.header h2,.hero h2{color:#fff!important}

/* General cards / panels */
.card,.gcard,.lesson,.panel,.wordCard,.vocabCard,.grammarCard{
  background:var(--hsk-surface)!important;
  border-color:var(--hsk-border)!important;
  box-shadow:0 3px 14px rgba(63,88,100,.06)!important;
}
h1,h2,h3,h4,.lessonTitle,.sectionTitle,.bookTitle{
  color:var(--hsk-primary)!important;
}

/* Buttons / tabs */
button,.btn,.tab,.bookTab{
  background:#668798!important;
  border-color:#668798!important;
  color:#fff!important;
}
button:hover,.btn:hover,.tab:hover,.bookTab:hover{
  background:#506f80!important;
}

/* Search / form */
input,select,textarea{
  background:#fff!important;
  border-color:var(--hsk-border)!important;
  color:var(--hsk-text)!important;
}
.searchBox,.search-bar{
  background:#fff!important;
  border-color:var(--hsk-border)!important;
}

/* Vocab — đổi toàn bộ sang xanh xám nhạt */
.vocabCard,.wordCard{
  background:var(--hsk-vocab)!important;
  border-color:var(--hsk-vocab-border)!important;
}
.vocabCard h3,.wordCard h3,
.vocabCard .word,.wordCard .word{
  color:#496f80!important;
}
.vocabCard .meaning,.wordCard .meaning{color:#5d7078!important}
.vocabCard .example,.wordCard .example{
  background:#f8fbfc!important;
  border-left-color:#9bb8c4!important;
}

/* Grammar */

/* =========================================================
   HSK 1 — BẢNG MÀU THEO BÌA GIÁO TRÌNH
   HSK Standard Course 1 có nhận diện màu vàng.

   ========================================================= */
:root{
  --hsk-bg:#fffaf0;
  --hsk-surface:#fffef9;
  --hsk-primary:#a87818;
  --hsk-primary-dark:#7d5b12;
  --hsk-accent:#c49a3a;
  --hsk-soft:#fff4cf;
  --hsk-border:#ead9a7;
  --hsk-text:#4b4434;
  --hsk-muted:#7b725f;
  --hsk-vocab:#fff8df;
  --hsk-vocab-border:#e8d49a;
  --hsk-write:#fff9e8;
}

/* Nền toàn trang */
html,body{
  background:var(--hsk-bg)!important;
  color:var(--hsk-text)!important;
}
body{
  background:linear-gradient(180deg,#fffdf7 0%,#fff7e6 100%)!important;
}

/* Header */
.top,.header,.hero{
  background:linear-gradient(135deg,#b88924,#d2ad55)!important;
  color:#fff!important;
}
.top h1,.header h1,.hero h1,
.top h2,.header h2,.hero h2{
  color:#fff!important;
}

/* Tiêu đề / tên bài */
h1,h2,h3,h4,
.lessonTitle,.sectionTitle,.bookTitle{
  color:#8a6517!important;
}

/* Card chung */
.card,.gcard,.lesson,.panel,.wordCard,.vocabCard,.grammarCard{
  background:var(--hsk-surface)!important;
  border-color:var(--hsk-border)!important;
  box-shadow:0 3px 14px rgba(130,100,35,.07)!important;
}

/* ================= TỪ VỰNG ================= */
.vocabCard,.wordCard{
  background:var(--hsk-vocab)!important;
  border-color:var(--hsk-vocab-border)!important;
}

.vocabCard .hanzi,.wordCard .hanzi{
  color:#8a671b!important;
}
.vocabCard .meaning,.wordCard .meaning{
  color:#665c47!important;
}

/* HSK3 */
body.is-hsk3{--g:#0f7a63;--g2:#27a47f;--l:#eaf9f4;--ink:#17352a;--m:#5d7068;--line:#cfe8df}
body.is-hsk3 .top{background:linear-gradient(135deg,#0b6f5a,#20a77e)}

.componentAnalysis{
  margin:7px auto 9px;padding:8px 11px;background:#fffdf6;
  border:1px solid #eadfbe;border-radius:12px;text-align:left;
  color:#574a32;font-size:13px;line-height:1.45
}
.componentAnalysis .componentHeader{
  font-weight:900;color:#9a6816;margin-bottom:4px
}
.componentAnalysis .componentNote{display:none}
.componentRow{
  display:flex;gap:7px;align-items:flex-start;padding:4px 0;
  border-top:1px dashed #eadfbe
}
.componentRow:first-of-type{border-top:0}
.componentGlyph{
  flex:0 0 34px;text-align:center;font-size:25px;font-weight:900;color:#8b5b10
}
.componentBody{flex:1}
.componentName{
  font-weight:900;
  color:#1f6f8b;
  font-size:14px;
}
.componentGlyph{
  font-size:25px;
}
.componentMeaning{color:#5e523d}
.componentRole{
  display:inline-block;margin-left:6px;padding:1px 6px;border-radius:7px;
  background:#f6edd8;color:#8a651f;font-size:11px;font-weight:800
}
.componentNested{
  margin-top:5px;padding-left:10px;border-left:2px solid #eadfbe;color:#6d604b
}


/* Ưu tiên mẹo nhớ; phân tích cấu tạo là phần bổ trợ */
.charCard .mnemonicInfo{order:2}
.charCard .radicalInfo{order:3}
.charCard .componentAnalysis{order:4;font-size:13px;padding:8px 10px;margin-top:6px}
.charCard .componentAnalysis .componentHeader{font-size:13px}

.inline-writer-surface{width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.strokeBox{overscroll-behavior:auto!important}
@media(max-width:650px){.strokeBox{touch-action:pan-y!important}}

.componentMeaning{color:#5e523d}
.componentIdentity{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.componentName{font-weight:900;color:#167a98;font-size:15px}
.componentGlyph{flex:0 0 42px;font-size:29px;font-weight:900;color:#8b5b10;line-height:1.2}
.componentMeaning{font-size:14px;color:#5e523d;margin-top:1px}
.componentNested{margin-top:6px;padding:7px 10px 5px;border-left:3px solid #e3d4aa;background:#fffaf0;border-radius:0 9px 9px 0}
.componentNested>b{display:block;color:#8b651c;font-size:13px;margin-bottom:3px}
@media(max-width:650px){.componentAnalysis{font-size:13px}.componentGlyph{flex-basis:40px}.componentName{font-size:15px}.componentMeaning{font-size:13px}}

/* ===== LUYỆN TẬP: TRẠNG THÁI ĐÁP ÁN ===== */
.quiz .opts button.correct,
.quiz .opts button.correct:hover,
.quiz .opts button.correct:focus{
  background:#dff5e9!important;
  border-color:#73c997!important;
  color:#176b52!important;
}
.quiz .opts button.wrong,
.quiz .opts button.wrong:hover,
.quiz .opts button.wrong:focus{
  background:#ffe5e2!important;
  border-color:#e58a80!important;
  color:#a63d35!important;
}
.quiz .opts button:disabled{
  cursor:default;
  opacity:1;
}

de bàba māma.","Tôi rất yêu bố mẹ của tôi."],"八":["我每天八点到学校上课。","Wǒ měi tiān bā diǎn dào xuéxiào shàng kè.","Mỗi ngày tôi đến trường học lúc 8 giờ."],"爸爸":["我的爸爸在学校附近工作。","Wǒ de bàba zài xuéxiào fùjìn gōngzuò.","Bố tôi làm việc gần trường."],"北京":["我明天要坐飞机去北京。","Wǒ míngtiān yào zuò fēijī qù Běijīng.","Ngày mai tôi sẽ đi máy bay đến Bắc Kinh."],"本":["这本汉语书是我的书。","Zhè běn Hànyǔ shū shì wǒ de shū.","Quyển sách tiếng Trung này là sách của tôi."],"不":["我今天不去学校上课。","Wǒ jīntiān bù qù xuéxiào shàng kè.","Hôm nay tôi không đi học."],"菜":["妈妈做的菜非常好吃。","Māma zuò de cài fēicháng hǎochī.","Món ăn mẹ nấu rất ngon."],"茶":["爸爸每天晚上喜欢喝茶。","Bàba měi tiān wǎnshang xǐhuan hē chá.","Tối nào bố tôi cũng thích uống trà."],"吃":["我们中午一起吃米饭和菜。","Wǒmen zhōngwǔ yìqǐ chī mǐfàn hé cài.","Buổi trưa chúng tôi cùng nhau ăn cơm và rau."],"出租车":["我们坐出租车去学校上课。","Wǒmen zuò chūzūchē qù xuéxiào shàng kè.","Chúng tôi đi taxi đến trường học."],"打电话":["我晚上给妈妈打电话聊天。","Wǒ wǎnshang gěi māma dǎ diànhuà liáo tiān.","Buổi tối tôi gọi điện cho mẹ để nói chuyện."],"大":["我的学校有一个很大的教室。","Wǒ de xuéxiào yǒu yī gè hěn dà de jiàoshì.","Trường tôi có một phòng học rất lớn."],"的":["这是我的汉语老师的书。","Zhè shì wǒ de Hànyǔ lǎoshī de shū.","Đây là sách của giáo viên tiếng Trung của tôi."],"点":["现在已经八点半了，我们走吧。","Xiànzài yǐjīng bā diǎn bàn le,wǒmen zǒu ba.","Bây giờ đã tám giờ rưỡi rồi, chúng ta đi thôi."],"电脑":["我每天用电脑学习汉语。","Wǒ měi tiān yòng diànnǎo xuéxí Hànyǔ.","Mỗi ngày tôi dùng máy tính để học tiếng Trung."],"电视":["爸爸晚上在家看电视节目。","Bàba wǎnshang zài jiā kàn diànshì jiémù.","Buổi tối bố tôi xem chương trình truyền hình ở nhà."],"电影":["我们星期六晚上一起看电影。","Wǒmen xīngqī liù wǎnshang yìqǐ kàn diànyǐng.","Tối thứ Bảy chúng tôi cùng nhau xem phim."],"东西":["桌子上有很多学习用的东西。","Zhuōzi shàng yǒu hěn duō xuéxí yòng de dōngxi.","Trên bàn có rất nhiều đồ dùng để học."],"都":["我们都是学校里的学生。","Wǒmen dōu shì xuéxiào lǐ de xuésheng.","Chúng tôi đều là học sinh trong trường."],"读":["我每天晚上读汉语课文。","Wǒ měi tiān wǎnshang dú Hànyǔ kè wén.","Mỗi tối tôi đều đọc bài let currentBookKey="hsk1", V=[], G=[], Q=[], EX={};
let answered=0,correct=0,currentWord=null;

function setBook(key){
  currentBookKey=key;
  const book=DATA.books[key];
  V=book.lessons?Object.values(book.lessons).flatMap(l=>l.vocab):[];
  G=book.lessons?Object.values(book.lessons).flatMap(l=>l.grammar):[];
  Q=book.lessons?Object.values(book.lessons).flatMap(l=>l.questions):[];
  EX=DATA["examples_"+key]||{};
  document.getElementById("bookSub").textContent=book.description||"";
  document.getElementById("vcount").textContent=V.length;
  document.getElementById("lcount").textContent=Object.keys(book.lessons||{}).length;
  document.getElementById("gcount").textContent=G.length;
  document.getElementById("qcount").textContent=Q.length;
  document.getElementById("grammarTitle").textContent="📘 NGỮ PHÁP – "+book.name.toUpperCase();
  document.getElementById("quizTitle").textContent="🎯 LUYỆN TẬP – "+book.name.toUpperCase();
  lesson.innerHTML='<option value="all">Tất cả bài</option>';
  Object.values(book.lessons||{}).forEach(l=>{
    const o=document.createElement("option");
    const lm=String(l.name).match(/^Bài\s*(\d+)/); o.value=lm?lm[1]:String(l.name); o.textContent=l.name; lesson.appendChild(o);
  });
  lesson.value="all";
  renderVocab(); renderGrammar(); renderQuiz();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function sentencePinyin(text){
  const t=String(text||"").trim();
  if(!t)return "";
  try{
    if(window.PinyinHelper && window.PinyinFormat){
      return PinyinHelper.convertToPinyinString(t," ",PinyinFormat.WITH_TONE_MARK)
        .replace(/\\s+([，。！？；：、,.!?;:])/g,"$1");
    }
  }catch(e){}
  return "";
}
function renderVocab(){
  let l=lesson.value,a=V.filter(x=>l==="all"||x[0]===l),last="",o="";
  a.forEach(x=>{
    if(x[0]!==last){o+=`<div class="lessonTitle">📚 BÀI ${x[0]}</div>`;last=x[0]}
    let ex=EX[x[1]];
    o+=`<article class="vocab-card"><div class="vtop"><div><div class="hanzi">${esc(x[1])}</div><div class="py">${esc(x[2])}</div><div class="meaning">${esc(x[3])}</div></div><span class="badge">Bài ${x[0]}</span></div>
    <div class="actions"><button onclick='speak(${JSON.stringify(x[1])})'>🔊 Phát âm</button><button onclick='openWriter(${JSON.stringify(x)})'>✍️ Viết + Chiết tự</button></div>
    ${ex?`<div class="example"><div class="ex-label">📝 Ví dụ</div><b>${esc(ex[0])}</b><div class="p" data-pinyin-for="${esc(ex[0])}">${esc(ex[1]||sentencePinyin(ex[0]))}</div><div class="vi">🇻🇳 ${esc(ex[2])}</div><div class="actions"><button onclick='speak(${JSON.stringify(ex[0])})'>🔊 Đọc câu</button></div></div>`:""}</article>`;
  });
  vocabList.innerHTML=o;
}
function normalizeSearchText(text){
  return String(text||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d");
}
function doSearch(){
  const raw=search.value.trim();
  const q=normalizeSearchText(raw);
  if(!q){results.style.display="none";return}

  const a=V.filter(x=>{
    const hanzi=normalizeSearchText(x[1]);
    const pinyin=normalizeSearchText(x[2]);
    const meaning=normalizeSearchText(x[3]);
    return hanzi.includes(q)||pinyin.includes(q)||meaning.includes(q);
  }).slice(0,20);

  results.innerHTML=a.map((x,i)=>`
    <button type="button" class="search-result-item" onclick='event.preventDefault();jumpToWord(${JSON.stringify(x[1])},${JSON.stringify(x[0])})'>
      <b>${esc(x[1])}</b>
      <span class="result-p">${esc(x[2])}</span>
      <span class="result-m">${esc(x[3])}</span>
    </button>`).join("");

  results.style.display=a.length?"block":"none";
}
function jumpToWord(ch,lessonNo){
  const vocabSection=document.getElementById("vocab");
  if(!vocabSection)return;

  // Chuyển về mục Từ vựng.
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  const vocabNav=document.querySelector('.nav button[data-sec="vocab"]');
  if(vocabNav)vocabNav.classList.add("active");
  document.querySelectorAll(".section").forEach(sec=>sec.classList.remove("active"));
  vocabSection.classList.add("active");

  // Đặt đúng bài. Các option bài học dùng value = số bài.
  const targetLesson=String(lessonNo);
  const hasOption=[...lesson.options].some(o=>o.value===targetLesson);
  lesson.value=hasOption?targetLesson:"all";

  // Render lại danh sách.
  renderVocab();

  // Không xóa nội dung ô tìm kiếm ngay; người học vẫn thấy mình vừa tìm gì.
  results.style.display="none";

  requestAnimationFrame(()=>{
    const cards=[...vocabList.querySelectorAll(".vocab-card")];
    const target=cards.find(card=>{
      const h=card.querySelector(".hanzi");
      return h && h.textContent.trim()===String(ch).trim();
    });

    if(target){
      target.classList.add("search-found");
      target.scrollIntoView({behavior:"smooth",block:"center"});
      setTimeout(()=>target.classList.remove("search-found"),2200);
    }
  });
}
// Giữ tương thích với các chỗ khác nếu có gọi jump(ch).
function jump(ch){
  const x=V.find(v=>v[1]===ch);
  if(x)jumpToWord(x[1],x[0]);
}
function renderGrammar(){
  let o="";
  const lessons=Object.values(DATA.books[currentBookKey].lessons||{});
  lessons.forEach(l=>{
    if(l.grammar?.length){
      o+=`<div class="lessonTitle" style="grid-column:1/-1">📘 BÀI ${l.name.replace("Bài ","")}</div>`;
      l.grammar.forEach(g=>{
        o+=`<article class="gcard">
          <h3>${esc(g[1])}</h3>
          <div class="formula grammarStructured">${formatGrammarDetail(g[2]||"")}</div>
        </article>`;
      });
    }
  });
  grammarList.innerHTML=o;
}
function renderQuiz(){
  quizList.innerHTML=Q.map((q,i)=>`<article class="quiz" id="q${i}"><div class="badge">Bài ${q[0]}</div><div class="q">${i+1}. ${esc(q[1])}</div><div class="opts">${q[2].map((o,j)=>`<button onclick="answerQ(${i},${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("")}</div><div class="explain" id="e${i}"></div></article>`).join("");
  score.textContent=`Điểm: 0 / ${Q.length}`;
}
function answerQ(i,j){
  let c=document.getElementById("q"+i); if(c.dataset.done)return;
  c.dataset.done=1;answered++;
  let b=c.querySelectorAll(".opts button"),ok=Q[i][3];
  b[ok].classList.add("correct");
  if(j!==ok)b[j].classList.add("wrong"); else correct++;
  b.forEach(x=>x.disabled=true);
  document.getElementById("e"+i).textContent="💡 "+Q[i][4];
  score.textContent=`Điểm: ${correct} / ${Q.length} · Đã làm: ${answered}`;
}
function resetQuiz(){answered=0;correct=0;renderQuiz()}
function openWriter(x){currentWord=x;document.body.style.overflow="hidden";modalWord.innerHTML=`<b>${esc(x[1])}</b> · ${esc(x[2])} · ${esc(x[3])}<div style="font-size:13px;color:#62736c;margin-top:6px">🧩 <b>Chiết tự:</b> xem <b>bộ thủ chính</b> và <b>nhiều thành phần cấu tạo</b> của từng chữ. 🧠 Mẹo nhớ ưu tiên hình ảnh/chiết tự/vè khi phù hợp.</div>`;showChars();modal.classList.add("show");
}

let RADICAL_DATA=null, radicalLoading=null;
async function loadRadicalData(){
  if(RADICAL_DATA)return RADICAL_DATA;
  if(radicalLoading)return radicalLoading;
  radicalLoading=fetch("https://raw.githubusercontent.com/skishore/makemeahanzi/refs/heads/master/dictionary.txt")
    .then(r=>{if(!r.ok)throw new Error("character data unavailable");return r.text()})
    .then(txt=>{
      const map={};
      txt.split(/\r?\n/).forEach(line=>{
        if(!line.trim())return;
        try{
          const o=JSON.parse(line);
          if(o.character){
            map[o.character]={
              pinyin:Array.isArray(o.pinyin)?o.pinyin:[],
              radical:o.radical||"",
              decomposition:o.decomposition||"",
              definition:o.definition||"",
              etymology:o.etymology||null
            };
          }
        }catch(e){}
      });
      RADICAL_DATA=map;
      try{localStorage.setItem("hanziRadicalData",JSON.stringify(map))}catch(e){}
      return map;
    })
    .catch(()=>{
      try{
        const cached=localStorage.getItem("hanziRadicalData");
        if(cached){RADICAL_DATA=JSON.parse(cached);return RADICAL_DATA}
      }catch(e){}
      return {};
    });
  return radicalLoading;
}

function parseDecomposition(ids){
  if(!ids || ids==="？")return null;
  const ops={"⿰":2,"⿱":2,"⿴":2,"⿵":2,"⿶":2,"⿷":2,"⿸":2,"⿹":2,"⿺":2,"⿻":2,"⿲":3,"⿳":3};
  let i=0;
  function parse(){
    const ch=ids[i++]; if(!ch)return null;
    if(ops[ch]){ const children=[]; for(let k=0;k<ops[ch];k++)children.push(parse()); return {op:ch,children}; }
    return {char:ch};
  }
  return parse();
}
function getTopComponents(ids){
  const tree=parseDecomposition(ids);
  return tree?.children ? tree.children.flatMap(flattenTree) : (tree?.char?[tree.char]:[]);
}
function flattenTree(node){
  if(!node)return [];
  if(node.char)return [node.char];
  return (node.children||[]).flatMap(flattenTree);
}
function getDirectComponents(ids){
  const tree=parseDecomposition(ids);
  return tree?.children ? tree.children.filter(x=>x?.char).map(x=>x.char) : [];
}
function removeRadicalFromComponents(comps,rad){
  const out=[...comps];
  if(rad){const idx=out.indexOf(rad);if(idx>=0)out.splice(idx,1);}
  return out;
}
function getComponentMeaning(c,obj){
  if(COMPONENT_VI[c])return COMPONENT_VI[c];
  if(EXTRA_COMPONENT_VI[c])return EXTRA_COMPONENT_VI[c];
  if(RADICAL_NAMES[c])return RADICAL_NAMES[c];
  if(obj?.etymology){
    const e=obj.etymology;
    if(e.phonetic===c)return "gợi âm";
    if(e.semantic===c)return "gợi nghĩa";
  }
  return "thành phần cấu tạo";
}
function relationLabel(parent,child,obj){
  if(!obj?.etymology)return "thành phần";
  const e=obj.etymology||{};
  if(e.semantic===child)return "gợi nghĩa";
  if(e.phonetic===child)return "gợi âm";
  return "thành phần";
}
function renderTreeHTML(node,obj,level=0){
  if(!node)return "";
  if(node.char){
    const c=node.char,vi=getComponentMeaning(c,obj);
    return `<span class="treeChar" title="${esc(vi)}">${esc(c)}</span><span class="treeRole">— ${esc(vi)}</span>`;
  }
  const parts=(node.children||[]).map(ch=>renderTreeHTML(ch,obj,level+1));
  const opName={"⿰":"trái + phải","⿱":"trên + dưới","⿴":"bao quanh","⿵":"trên + bao dưới","⿶":"dưới + bao trên","⿷":"trái bao","⿸":"trên-trái bao","⿹":"trên-phải bao","⿺":"dưới-trái bao","⿻":"chồng nét","⿲":"trái + giữa + phải","⿳":"trên + giữa + dưới"}[node.op]||"kết hợp";
  return `<div class="componentTreeLine"><span class="treeRole">${esc(opName)}:</span> ${parts.join(' <b>＋</b> ')}</div>`;
}

function getMnemonic(char,obj){
  if(CLASS_MNEMONICS[char]) return CLASS_MNEMONICS[char];
  return "";
}

function renderMnemonic(index,char){
  const el=document.getElementById("mnemonic_"+index);
  if(!el)return;
  const mn=getMnemonic(char,{});
  if(mn){
    el.innerHTML=`🧠 <span class="mnemonicTitle">Mẹo nhớ chữ Hán:</span><div class="mnemonicText">${esc(mn)}</div>`;
    el.style.display="block";
  }else{
    el.innerHTML="";
    el.style.display="none";
  }
}

function formatGrammarDetail(text){
  if(!text)return "";
  const lines=String(text).split(/\r?\n/);
  let out="",open=false;
  lines.forEach(line=>{
    const t=line.trim();
    if(!t)return;
    const h=t.match(/^(\d+)[.)]\s*(.+)$/);
    if(h){
      if(open)out+="</div>";
      out+=`<div class="grammarTopic"><div class="grammarTopicTitle">${esc(h[1]+". "+h[2])}</div>`;
      open=true;
      return;
    }
    if(/^Cấu trúc\s*:/i.test(t)){
      out+=`<div class="grammarFormula">${esc(t)}</div>`;
      return;
    }
    if(/^[•·]\s*/.test(t)){
      out+=`<div class="grammarExample">${esc(t)}</div>`;
      return;
    }
    out+=`<div class="grammarLine">${esc(t)}</div>`;
  });
  if(open)out+="</div>";
  return out;
}
function collectRadicalsInOrder(char, data, seen=new Set(), trail=new Set()){
  // The character's decomposition is traversed in structural reading order.
  // Every leaf that is itself a radical (including common radical forms such
  // as 亻/忄/氵/扌/艹/讠/辶) is collected. If a leaf is a larger component,
  // recurse into that component's decomposition.
  if(!char || trail.has(char)) return [];
  const info=data?.[char]||{};
  const direct=parseDecomposition(info.decomposition||"");

  // Không chỉ dựa vào bảng tên bộ thủ thủ công. Make Me a Hanzi
  // ghi rõ `radical` cho từng chữ; nếu radical của chính thành phần đó
  // trùng với bản thân nó thì đây là một bộ thủ/thành phần bộ thủ độc lập.
  // Cách này bao phủ cả các dạng bộ thủ biến thể như 亻、氵、扌、艹、讠、辶
  // và những radical glyph mà bảng tên thủ công có thể chưa liệt kê.
  if(RADICAL_NAMES[char] || info.radical===char) return [char];

  if(!direct || !direct.children) return [];

  const nextTrail=new Set(trail);
  nextTrail.add(char);

  const out=[];
  for(const child of direct.children){
    if(child?.char){
      out.push(...collectRadicalsInOrder(child.char,data,seen,nextTrail));
    }else{
      out.push(...collectRadicalsFromTree(child,data,seen,nextTrail));
    }
  }
  return out;
}
function collectRadicalsFromTree(node,data,seen,trail){
  if(!node)return [];
  if(node.char)return collectRadicalsInOrder(node.char,data,seen,trail);
  return (node.children||[]).flatMap(ch=>collectRadicalsFromTree(ch,data,seen,trail));
}
function formatRadicalList(list){
  const counts=new Map();
  list.forEach(r=>counts.set(r,(counts.get(r)||0)+1));
  return [...counts.entries()].map(([r,n])=>{
    const name=RADICAL_NAMES[r]||"";
    const meaning=RADICAL_MEANINGS[r]||"";
    return `<span class="radicalPill"><span class="radicalChar">${esc(r)}</span>${name?` <span class="radicalName">(${esc(name)})</span>`:""}${meaning?` <span class="radicalMeaning">— ${esc(meaning)}</span>`:""}${n>1?` <b class="radicalCount">×${n}</b>`:""}</span>`;
  }).join(' <span class="radicalSep">＋</span> ');
}

function componentMeaningDetailed(c,obj,data,trail=new Set()){
  if(COMPONENT_VI[c]) return COMPONENT_VI[c];
  if(EXTRA_COMPONENT_VI[c]) return EXTRA_COMPONENT_VI[c];
  if(RADICAL_MEANINGS[c]) return RADICAL_MEANINGS[c];
  if(RADICAL_NAMES[c]) return "Bộ " + RADICAL_NAMES[c];
  const info=data?.[c]||{};
  if(info.etymology){
    if(info.etymology.semantic===c) return "thành phần gợi nghĩa";
    if(info.etymology.phonetic===c) return "thành phần gợi âm";
  }
  if(COMPONENT_SUPPLEMENT_VI[c]) return COMPONENT_SUPPLEMENT_VI[c];
  if(COMPONENT_VOCAB_VI[c]) return COMPONENT_VOCAB_VI[c];
  // Không hiển thị definition từ MakeMeAHanzi vì nguồn này dùng tiếng Anh.
  // Nếu không có nghĩa tiếng Việt cục bộ, dùng mô tả cấu tạo bằng tiếng Việt.

  if(!trail.has(c) && info.decomposition){
    const tree=parseDecomposition(info.decomposition);
    const leaves=collectLeafChars(tree).filter(x=>x!==c);
    if(leaves.length){
      return "thành phần cấu tạo; xem các phần bên dưới";
    }
  }
  return "thành phần cấu tạo, không có nghĩa độc lập rõ ràng";
}
function collectLeafChars(node){
  if(!node)return [];
  if(node.char)return [node.char];
  return (node.children||[]).flatMap(collectLeafChars);
}
function componentRole(parent,child,obj){
  const e=obj?.etymology||{};
  if(e.semantic===child)return "gợi nghĩa";
  if(e.phonetic===child)return "gợi âm";
  return "thành phần";
}
function componentPinyin(c,info){
  if(!/^[\u3400-\u9fff]$/.test(c)) return "";
  if(COMPONENT_PINYIN[c]) return COMPONENT_PINYIN[c];
  if(COMPONENT_LOCAL?.py?.[c]) return COMPONENT_LOCAL.py[c];
  if(Array.isArray(info?.pinyin) && info.pinyin.length) return info.pinyin[0];
  return "";
}
function buildComponentLocalMaps(){
  const py={}, meaning={};
  try{
    const books=DATA?.books||{};
    Object.values(books).forEach(book=>Object.values(book.lessons||{}).forEach(lesson=>{
      (lesson.vocab||[]).forEach(v=>{
        const word=v?.[1], p=v?.[2], m=v?.[3];
        if(typeof word==="string" && [...word].length===1 && /[\u3400-\u9fff]/.test(word)){
          if(p) py[word]=p;
          if(m) meaning[word]=m;
        }
      });
    }));
  }catch(e){}
  return {py,meaning};
}
const COMPONENT_LOCAL=buildComponentLocalMaps();

function renderComponentRows(node,parentObj,data,level=0,excludedSet=new Set(),shown=new Set()){
  if(!node)return "";
  if(node.char){
    const c=node.char;
    // Chỉ loại bộ thủ chính đã hiển thị ở dòng Bộ thủ; không loại các bộ
    // thủ nằm bên trong một thành phần khác.
    if(excludedSet.has(c)) return "";
    const info=data?.[c]||{};
    const meaning=componentMeaningDetailed(c,info,data) || COMPONENT_LOCAL.meaning[c] || "thành phần chữ Hán";
    const role=parentObj?componentRole(parentObj.character||"",c,parentObj):"thành phần";
    const isHan=/[\u3400-\u9fff]/.test(c);
    const pinyin=isHan?componentPinyin(c,info):"";
    return `<div class="componentRow">
      <div class="componentGlyph">${esc(c)}</div>
      <div class="componentBody">
        <div class="componentIdentity">
          ${isHan&&pinyin?`<span class="componentName">${esc(pinyin)}</span>`:`<span class="componentName">${esc(c)}</span>`}
          ${role&&role!=="thành phần"?`<span class="componentRole">${esc(role)}</span>`:""}
        </div>
        <div class="componentMeaning">${esc(meaning)}</div>
      </div>
    </div>`;
  }
  const opName={"⿰":"trái + phải","⿱":"trên + dưới","⿴":"bao quanh","⿵":"trên + bao dưới","⿶":"dưới + bao trên","⿷":"trái bao","⿸":"trên-trái bao","⿹":"trên-phải bao","⿺":"dưới-trái bao","⿻":"chồng nét","⿲":"trái + giữa + phải","⿳":"trên + giữa + dưới"}[node.op]||"cấu tạo";
  const inner=(node.children||[]).map(ch=>renderComponentRows(ch,parentObj,data,level+1,excludedSet,shown)).join("");
  return inner ? `<div class="componentNested"><b>${esc(opName)}</b>${inner}</div>` : "";
}

function renderComponentAnalysis(index,char,data){
  const el=document.getElementById("components_"+index);
  if(!el)return;
  const info=data?.[char]||{};
  const tree=parseDecomposition(info.decomposition||"");
  // Dùng đúng bộ thủ chính của MakeMeAHanzi, thay vì coi mọi bộ thủ
  // lồng bên trong thành một "bộ thủ" độc lập.
  const allRadicals=collectRadicalsInOrder(char,data).filter(Boolean);
  // Trong phần phân tích cấu tạo thêm, không lặp lại các bộ thủ đã được
  // liệt kê ở dòng "Bộ thủ"; nhưng các thành phần không phải bộ thủ vẫn giữ.
  const excluded=new Set(allRadicals);
  if(!tree){ el.innerHTML=""; return; }
  const rows=renderComponentRows(tree,info,data,0,excluded,new Set());
  el.innerHTML=rows ? `<div class="componentHeader">🧩 Phân tích cấu tạo thêm</div>${rows}` : "";
}
function validateRadicalListing(char,data){
  const info=data?.[char]||{};
  const found=collectRadicalsInOrder(char,data).filter(Boolean);
  const fallback=info.radical?[info.radical]:[];
  const radicals=found.length?found:fallback;
  return {radicals, count:radicals.length, source:found.length?"decomposition":"radical"};
}
function renderRadical(index,char,info,data){
  const el=document.getElementById("radical_"+index); if(!el)return;
  const obj=(typeof info==="string")?{radical:info}:info||{};
  const source=data||RADICAL_DATA||{};
  // LIỆT KÊ ĐẦY ĐỦ CÁC BỘ THỦ THỰC SỰ XUẤT HIỆN TRONG CHỮ.
  // Một chữ có thể có nhiều bộ thủ/thành phần bộ thủ (ví dụ 明 = 日 + 月,
  // 林 = 木 + 木). Vì vậy tuyệt đối không chỉ lấy `radical` chính của chữ.
  // Duyệt toàn bộ cây decomposition theo đúng thứ tự cấu tạo; giữ nguyên
  // cả trường hợp cùng một bộ thủ xuất hiện nhiều lần.
  let radicals=collectRadicalsInOrder(char,source).filter(Boolean);
  // Nếu nguồn không có decomposition/không dò được, vẫn giữ radical chính
  // do nguồn cung cấp để không làm mất dữ liệu.
  if(obj.radical && !radicals.includes(obj.radical)) radicals.unshift(obj.radical);
  el.innerHTML=radicals.length
    ? `🔹 <b>Bộ thủ:</b> <span class="radicalList">${formatRadicalList(radicals)}</span>`
    : `🔹 <b>Bộ thủ:</b> <span class="radicalMissing">chưa có dữ liệu</span>`;
  renderComponentAnalysis(index,char,source);
}

function makeCanvas(btn){
  const card=btn.closest(".charCard"), box=card?.querySelector(".strokeBox");
  const char=card?.dataset.char||"";
  if(!card||!box||!char)return;
  // Stop the animated guide if it was previously opened.
  if(card._hanziWriter){
    try{card._hanziWriter.cancelQuiz?.(); card._hanziWriter.hideCharacter?.({duration:0});}catch(e){}
    card._hanziWriter=null;
  }

  // Remove previous writing controls/status from this card.
  card.querySelector(".writeAreaTools")?.remove();

  box.innerHTML=`<canvas aria-label="Ô tự viết chữ Hán"></canvas>`;
  const tools=document.createElement("div");
  tools.className="writeAreaTools";
  tools.innerHTML=`
    <div class="writeTools">
      <button type="button" onclick="undoStroke(this)">↩ Hoàn tác</button>
      <button type="button" onclick="redoStroke(this)">↪ Làm lại</button>
      <button type="button" class="clear" onclick="clearWriting(this)">🗑 Xóa</button>
      <button type="button" class="gradeWrite" onclick='gradeWriting(this,${JSON.stringify(char)})'>✓ Chấm nét</button>
    </div>
    <div class="writeStatus neutral">✍️ Hãy viết chữ mờ ở chính giữa ô.</div>`;
  box.insertAdjacentElement("afterend",tools);

  const cv=box.querySelector("canvas");
  const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,3));
  const state={strokes:[],redo:[],current:null,char};
  cv._writeState=state;

  const resize=()=>{
    const r=cv.getBoundingClientRect();
    const old=state.strokes;
    cv.width=Math.max(1,Math.floor(r.width*dpr));
    cv.height=Math.max(1,Math.floor(r.height*dpr));
    const ctx=cv.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));
    ctx.lineCap="round";ctx.lineJoin="round";
    redraw();
  };
  const point=e=>{
    const r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  };
  const redraw=()=>{
    const r=cv.getBoundingClientRect(),ctx=cv.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);

    // Faint centered guide.
    const size=Math.min(r.width,r.height)*.62;
    ctx.save();
    ctx.font=`900 ${size}px "Noto Sans CJK SC","Microsoft YaHei","SimSun",sans-serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle="#1769c2";ctx.globalAlpha=.30;
    ctx.fillText(char,r.width/2,r.height/2-8);
    ctx.restore();

    ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));
    ctx.lineCap="round";ctx.lineJoin="round";
    const drawStroke=st=>{
      if(!st.length)return;
      ctx.beginPath();ctx.moveTo(st[0].x,st[0].y);
      for(let i=1;i<st.length;i++)ctx.lineTo(st[i].x,st[i].y);
      ctx.stroke();
    };
    state.strokes.forEach(drawStroke);
    if(state.current)drawStroke(state.current);
  };

  requestAnimationFrame(resize);
  window.addEventListener("resize",resize,{once:true});

  const begin=e=>{
    if(e.cancelable)e.preventDefault();
    const p=point(e);
    state.current=[p]; state.redo=[]; redraw();
    const st=tools.querySelector(".writeStatus");
    if(st){st.className="writeStatus neutral";st.textContent="✍️ Đang viết…";}
  };
  const move=e=>{
    if(!state.current)return;
    if(e.cancelable)e.preventDefault();
    const pt=point(e),last=state.current[state.current.length-1];
    if(Math.hypot(pt.x-last.x,pt.y-last.y)>.7){state.current.push(pt);redraw();}
  };
  const finish=e=>{
    if(!state.current)return;
    if(e?.cancelable)e.preventDefault();
    if(state.current.length>1)state.strokes.push(state.current);
    state.current=null;redraw();
  };

  // Pointer Events: modern Android/iOS browsers.
  cv.addEventListener("pointerdown",begin,{passive:false});
  cv.addEventListener("pointermove",move,{passive:false});
  cv.addEventListener("pointerup",finish,{passive:false});
  cv.addEventListener("pointercancel",finish,{passive:false});

  // Touch fallback only for browsers without Pointer Events.
  // Modern Android/iOS use Pointer Events exclusively, preventing duplicate
  // touch + pointer streams that can interfere with page scrolling.
  if(!("PointerEvent" in window)){
    cv.addEventListener("touchstart",e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];
      begin({clientX:t.clientX,clientY:t.clientY,cancelable:e.cancelable,preventDefault:()=>e.preventDefault()});
    },{passive:false});
    cv.addEventListener("touchmove",e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];
      move({clientX:t.clientX,clientY:t.clientY,cancelable:e.cancelable,preventDefault:()=>e.preventDefault()});
    },{passive:false});
    cv.addEventListener("touchend",e=>finish(e),{passive:false});
    cv.addEventListener("touchcancel",e=>finish(e),{passive:false});
  }


  btn.dataset.writerReady="1";
  btn.textContent="🖐 Tự viết lại";
}
async function gradeWriting(btn,char){
  const card=btn.closest(".charCard"),cv=card?.querySelector("canvas"),state=cv?._writeState;
  const status=card?.querySelector(".writeStatus");
  if(!state||!status)return;

  if(!state.strokes.length){
    status.className="writeStatus bad";
    status.textContent="⚠️ Bạn chưa viết nét nào. Hãy viết chữ trước rồi bấm “Chấm nét”.";
    return;
  }

  status.className="writeStatus neutral";
  status.textContent="⏳ Đang kiểm tra bài viết…";

  // Stable offline-friendly grading:
  // 1) compare number of user strokes with the official stroke count;
  // 2) compare each stroke's general direction and relative length.
  // The official stroke count is obtained from HanziWriter when available.
  let expected=null;
  try{
    if(typeof HanziWriter!=="undefined"){
      const host=document.createElement("div");
      host.style.cssText="position:fixed;left:-10000px;top:0;width:100px;height:100px;opacity:0;pointer-events:none";
      document.body.appendChild(host);
      const w=HanziWriter.create(host,char,{width:100,height:100,padding:5,showCharacter:false,showOutline:false});
      expected=w?._character?.strokes?.length || null;
      try{w?.cancel?.();}catch(e){}
      host.remove();
    }
  }catch(e){ expected=null; }

  // Fallback: if the library cannot load, still provide a useful check.
  const user=state.strokes.filter(x=>x.length>1);
  const strokeCountOK=expected==null ? true : user.length===expected;

  const box=cv.getBoundingClientRect();
  const diag=Math.hypot(box.width,box.height)||1;
  const features=user.map(st=>{
    const first=st[0], last=st[st.length-1];
    const dx=last.x-first.x, dy=last.y-first.y;
    const len=st.reduce((sum,p,i)=>i?sum+Math.hypot(p.x-st[i-1].x,p.y-st[i-1].y):0,0);
    const angle=Math.atan2(dy,dx);
    return {len:len/diag,angle,dx,dy};
  });

  // Basic handwriting sanity checks: extremely tiny strokes are marked as suspicious.
  const tiny=features.filter(f=>f.len<0.025).length;
  const suspicious=tiny;

  let msg="";
  if(strokeCountOK && suspicious===0){
    msg=expected
      ? `🎉 Số nét khớp: ${user.length}/${expected}. Bài viết đạt yêu cầu cơ bản.`
      : `✓ Đã viết ${user.length} nét. Bài viết đạt yêu cầu cơ bản.`;
    status.className="writeStatus done";
  }else{
    const parts=[];
    if(expected!=null && !strokeCountOK) parts.push(`đang có ${user.length} nét, cần ${expected} nét`);
    if(suspicious) parts.push(`${suspicious} nét quá ngắn`);
    msg=`✗ Chưa đạt: ${parts.join(" và ")}. Hãy xem lại hướng dẫn rồi viết lại.`;
    status.className="writeStatus bad";
  }

  status.textContent=msg;
  btn.textContent="✓ Chấm lại";
}

function getWriteState(btn){
  return btn.closest(".charCard")?.querySelector("canvas")?._writeState || null;
}
function undoStroke(btn){
  const s=getWriteState(btn); if(!s||!s.strokes.length)return;
  s.redo.push(s.strokes.pop()); redrawExternal(btn);
}
function redoStroke(btn){
  const s=getWriteState(btn); if(!s||!s.redo.length)return;
  s.strokes.push(s.redo.pop()); redrawExternal(btn);
}
function clearWriting(btn){
  const s=getWriteState(btn); if(!s)return;
  s.strokes=[];s.redo=[];s.current=null;redrawExternal(btn);
}
function redrawExternal(btn){
  const card=btn.closest(".charCard"),cv=card?.querySelector("canvas"),st=cv?._writeState;
  if(!cv||!st)return;
  const r=cv.getBoundingClientRect(),dpr=Math.max(1,Math.min(window.devicePixelRatio||1,3));
  const ctx=cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  const size=Math.min(r.width,r.height)*.62;
  ctx.save();
  ctx.font=`900 ${size}px "Noto Sans CJK SC","Microsoft YaHei","SimSun",sans-serif`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#1769c2";ctx.globalAlpha=.30;
  ctx.fillText(st.char,r.width/2,r.height/2-8);
  ctx.restore();
  ctx.lineWidth=Math.max(3,Math.min(6,r.width/120));ctx.lineCap="round";ctx.lineJoin="round";
  st.strokes.forEach(x=>{
    if(!x.length)return;
    ctx.beginPath();ctx.moveTo(x[0].x,x[0].y);
    for(let i=1;i<x.length;i++)ctx.lineTo(x[i].x,x[i].y);
    ctx.stroke();
  });
}
function practiceAll(){if(!currentWord)return;let b=charGrid.querySelector(".charCard .writePracticeBtn");if(b)b.click()}
function showInlineGuide(btn,char,index){
  const card=btn.closest(".charCard"), box=card?.querySelector(".strokeBox");
  if(!card||!box)return;
  if(card._hanziWriter){
    try{
      card._hanziWriter.cancelQuiz?.();
      card._hanziWriter.hideCharacter({duration:0});
      card._hanziWriter.showOutline({duration:0});
      card._hanziWriter.animateCharacter();
      btn.textContent="🔁 Xem lại hướng dẫn";
    }catch(e){}
    return;
  }
  if(typeof HanziWriter==="undefined"){
    alert("Không tải được dữ liệu nét. Hãy mở file khi có Internet.");
    return;
  }
  box.innerHTML=`<div id="inlineWriter_${index}" class="inline-writer-surface"></div>`;
  try{
    const writer=HanziWriter.create(document.getElementById("inlineWriter_"+index),char,{
      width:280,height:280,padding:10,
      showOutline:true,showCharacter:false,
      strokeAnimationSpeed:1.2,delayBetweenStrokes:220,
      strokeColor:"#1769c2",radicalColor:"#f28c28",
      outlineColor:"#b9d8f3",highlightColor:"#67aef2",
      showHintAfterMisses:1,highlightOnComplete:true
    });
    card._hanziWriter=writer;
    btn.textContent="🔁 Xem lại hướng dẫn";
    setTimeout(()=>{try{writer.animateCharacter()}catch(e){}},80);
  }catch(e){
    box.innerHTML=`<div class="bigChar">${esc(char)}</div>`;
  }
}
